<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<title>SYNTRA</title>
<style>
:root{--bg:#04060a;--p1:#080c13;--p2:#0e1521;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--tx:#f5f8ff;--mu:#8793ab;--b:#2f7bff;--b2:#6aa8ff;--glow:0 0 28px rgba(47,123,255,.35);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(40% 35% at 20% 10%,rgba(47,123,255,.17),transparent 70%),radial-gradient(35% 30% at 85% 90%,rgba(47,123,255,.1),transparent 70%);animation:drift 18s ease-in-out infinite alternate;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
#app{position:relative;display:flex;height:100dvh;z-index:1}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s var(--ease),visibility .8s}
#splash.out{opacity:0;visibility:hidden}
.sp-word{display:flex;gap:.32em;font-size:clamp(30px,8vw,54px);font-weight:600;letter-spacing:.1em}
.sp-word span{opacity:0;transform:translateY(14px);filter:blur(8px);animation:letter .9s var(--ease) forwards}
.sp-sub{color:var(--mu);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:0;animation:fade 1s .9s forwards;text-align:center;line-height:1.8}
.logo{width:64px;height:64px}
.logo .o{transform-origin:32px 32px;animation:spin 6s linear infinite}
.logo .o2{transform-origin:32px 32px;animation:spin 9s linear infinite reverse}

/* sidebar */
#side{width:290px;flex:none;background:rgba(8,12,19,.85);backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));gap:14px;transition:transform .55s var(--ease);z-index:30}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.28em;font-size:15px;padding:2px 6px}
.brand .logo{width:30px;height:30px}
.btn{padding:11px 18px;border-radius:14px;font-weight:500;font-size:14px;transition:all .4s var(--ease);border:1px solid var(--line2)}
.btn.primary{background:var(--b);border-color:var(--b);color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 0 36px rgba(47,123,255,.55)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
#roomList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:0 -4px;padding:0 4px}
.room{position:relative;padding:12px 38px 12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--p1);cursor:pointer;transition:all .45s var(--ease);animation:fadeUp .5s var(--ease)}
.room:hover{border-color:var(--line2);transform:translateX(2px)}
.room.on{border-color:var(--b);background:rgba(47,123,255,.1);box-shadow:var(--glow)}
.rname{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{color:var(--mu);font-size:12px;margin-top:3px}
.rfaces{display:flex;margin-top:9px}.rfaces .face{margin-right:-8px;box-shadow:0 0 0 2px var(--p1)}
.room .x{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;color:var(--mu);opacity:0;transition:.3s}
.room:hover .x,.room.on .x{opacity:1}.room .x:hover{background:rgba(255,255,255,.08);color:#fff}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mu);font-size:11.5px;line-height:1.55}
.side-foot b{color:var(--tx);font-weight:600}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--p1);transition:.35s var(--ease);flex:none}
.ib:hover{border-color:var(--b);box-shadow:var(--glow)}
.ib svg{width:19px;height:19px}
#backdrop{display:none}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
#menuBtn{display:none}
#roomTitle{flex:1;min-width:0;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--b);color:var(--b2);font-size:12px;background:rgba(47,123,255,.08);animation:pulseb 2.4s ease-in-out infinite}
#team{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
#team::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:99px;border:1px solid var(--line);background:var(--p1);transition:all .45s var(--ease);animation:fadeUp .5s var(--ease)}
.chip:hover{border-color:var(--line2);transform:translateY(-1px)}
.chip.on{border-color:var(--b);background:rgba(47,123,255,.12);box-shadow:var(--glow)}
.chip .ct{display:flex;flex-direction:column;text-align:left;max-width:130px}
.chip .cn{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cr{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.add{padding:5px 16px 5px 5px;border-style:dashed;color:var(--b2)}
.nodeic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(47,123,255,.12);border:1px solid rgba(106,168,255,.4);flex:none}
.nodeic svg{width:20px;height:20px;color:var(--b2)}
#stage{flex:1;min-height:0;display:flex;flex-direction:column}
.ahead{display:flex;align-items:center;gap:16px;padding:16px max(20px,calc((100% - 780px)/2))}
.ainfo{flex:1;min-width:0}
.aname{font-size:20px;font-weight:600;letter-spacing:.01em}
.arole{color:var(--mu);font-size:13.5px;margin-top:2px}
.astat{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden}
.astat span{overflow:hidden;text-overflow:ellipsis}
.pulse{width:7px;height:7px;border-radius:50%;background:#5b6577;flex:none;transition:.4s}
.astat[data-st=thinking] .pulse,.work .pulse{background:var(--b);box-shadow:0 0 0 0 rgba(47,123,255,.7);animation:ping 1.4s infinite}
.astat[data-st=thinking]{color:var(--b2)}
.astat[data-st=talking] .pulse{background:#fff;box-shadow:0 0 12px #fff}
.astat[data-st=talking]{color:#fff}
#msgs{flex:1;overflow-y:auto;padding:8px max(16px,calc((100% - 780px)/2)) 20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;animation:fadeUp .55s var(--ease)}
.msg.user{justify-content:flex-end}
.bubble{max-width:84%;padding:11px 15px;border-radius:19px;line-height:1.55;font-size:15px;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#3b86ff,#1b55d6);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 26px rgba(47,123,255,.25)}
.msg.bot .bubble{background:var(--p2);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.err{border-color:rgba(255,255,255,.35)!important;color:#cfd8ea}
.bubble.typing{white-space:pre-wrap}
.bubble.typing::after{content:"";display:inline-block;width:7px;height:15px;margin-left:3px;vertical-align:-2px;background:var(--b2);animation:blink2 .7s steps(1) infinite}
.bubble pre{background:#02050b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;overflow-x:auto;font-size:13px;white-space:pre}
.bubble code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:13px}
.msg.peer,.msg.feed{opacity:.92}
.pb{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu);padding:9px 13px;border:1px dashed var(--line2);border-radius:16px;max-width:90%;line-height:1.5;margin-left:14px}
.pb b{color:var(--b2);font-weight:500}
.fb{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.5;max-width:calc(100% - 44px)}
.msg.feed{gap:10px;align-items:flex-start}
.fmeta{font-size:11.5px;color:var(--mu);margin-bottom:3px}.fmeta b{color:var(--b2);font-weight:500}
.ud{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;font-size:13px;font-weight:700;flex:none}
.hint{margin:auto;text-align:center;color:var(--mu);font-size:14px;line-height:1.7;max-width:340px;animation:fadeUp .8s var(--ease)}
.work{align-self:flex-start;min-width:230px;max-width:84%;padding:13px 16px;border-radius:18px;border:1px solid rgba(47,123,255,.4);background:rgba(47,123,255,.07);animation:fadeUp .5s var(--ease);transition:opacity .35s}
.work.out{opacity:0}
.wt{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--b2)}
.bar{height:3px;border-radius:9px;background:rgba(255,255,255,.08);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,transparent,var(--b),#fff,transparent);animation:slide 1.5s var(--ease) infinite}
.wl{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.wl div{animation:fadeUp .4s var(--ease)}
.comp{display:flex;gap:10px;align-items:flex-end;padding:10px max(14px,calc((100% - 780px)/2)) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(4,6,10,.6);backdrop-filter:blur(12px)}
textarea,.in{width:100%;background:var(--p1);border:1px solid var(--line2);color:var(--tx);border-radius:18px;padding:12px 16px;font:inherit;font-size:16px;outline:none;transition:border-color .3s,box-shadow .3s}
textarea{flex:1;resize:none;max-height:140px;line-height:1.4;border-radius:22px}
textarea:focus,.in:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(47,123,255,.18)}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--b);display:grid;place-items:center;flex:none;box-shadow:var(--glow);transition:.35s var(--ease)}
.sendbtn:hover{transform:scale(1.07) rotate(-6deg)}.sendbtn svg{width:20px;height:20px}
.hero{margin:auto;text-align:center;padding:30px;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;animation:fadeUp .9s var(--ease)}
.hero .logo{width:92px;height:92px}
.hero h1{font-size:34px;letter-spacing:.3em;font-weight:600;padding-left:.3em}
.hero p{color:var(--mu);line-height:1.7;font-size:14.5px}
.hero small{color:var(--mu);font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.9}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px)}
#modal.show{display:flex;animation:fade .3s}
#sheet{width:min(470px,100%);max-height:92dvh;overflow:auto;background:var(--p1);border:1px solid var(--line2);border-radius:24px;padding:24px;animation:pop .55s var(--ease);box-shadow:0 30px 90px rgba(0,0,0,.6),var(--glow)}
#sheet h3{font-size:19px;font-weight:600;margin-bottom:4px}
#sheet .sub{color:var(--mu);font-size:13.5px;margin-bottom:16px;line-height:1.55}
#sheet form{display:flex;flex-direction:column;gap:11px}
#sheet label{font-size:12px;color:var(--mu);letter-spacing:.05em;margin-bottom:-5px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{padding:6px 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--mu);transition:.3s}
.sug:hover{border-color:var(--b);color:#fff;background:rgba(47,123,255,.12)}
.mem{display:flex;flex-direction:column;gap:6px;max-height:170px;overflow:auto}
.mem div{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:12px;background:var(--p2);border:1px solid var(--line)}
.mem button{color:var(--mu);margin-left:auto}
.center{display:flex;justify-content:center}
select.in{appearance:none}

/* faces */
.face{position:relative;flex:none;width:var(--s,44px);height:var(--s,44px);border-radius:50%;background:#02050c;box-shadow:0 0 0 1px rgba(106,168,255,.35),0 0 calc(var(--s,44px)*.35) rgba(47,123,255,.2);transition:box-shadow .6s var(--ease)}
.face svg{width:100%;height:100%;display:block;overflow:visible}
.face[data-state=thinking]{animation:fpulse 1.6s ease-in-out infinite}
.face[data-state=talking]{box-shadow:0 0 0 1.5px #9cc2ff,0 0 calc(var(--s,44px)*.55) rgba(47,123,255,.6)}
.body{transform-origin:50px 95px;animation:breathe 5s ease-in-out infinite;animation-delay:var(--bd,0s)}
[data-state=thinking] .body{animation:tilt 2.6s ease-in-out infinite}
[data-state=talking] .body{animation:nod 1.1s ease-in-out infinite}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink calc(3.4s + var(--bv,1)*1s) infinite;animation-delay:var(--bd,0s)}
.pupil{transform:translate(calc(var(--ex,0)*1px),calc(var(--ey,0)*1px))}
.brow{transition:transform .5s var(--ease)}
[data-state=thinking] .brow{transform:translateY(-1.3px)}
.mouth-c{transition:opacity .2s}
.mouth-w,.mouth-o{transform-box:fill-box;transform-origin:50% 50%}
.mouth-o{transform:scaleY(0)}
[data-state=talking] .mouth-c{opacity:0}
[data-state=talking] .mouth-o{animation:talk .26s ease-in-out infinite alternate}
[data-state=talking] .mouth-w{animation:talkw .41s ease-in-out infinite alternate}
.ring{fill:none;stroke:rgba(106,168,255,.55);stroke-width:1.4;transform-box:fill-box;transform-origin:center}
[data-state=thinking] .ring{stroke:#6aa8ff;stroke-dasharray:14 9;animation:spin 2.2s linear infinite}
.glow{animation:gl 2.4s ease-in-out infinite}
.scanbar{animation:scanmv 5s linear infinite}

@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(47,123,255,0)}100%{box-shadow:0 0 0 0 rgba(47,123,255,0)}}
@keyframes pulseb{50%{box-shadow:0 0 18px rgba(47,123,255,.4)}}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes blink2{50%{opacity:0}}
@keyframes blink{0%,93%{transform:scaleY(0)}95.5%{transform:scaleY(1)}98%,100%{transform:scaleY(0)}}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.1px) rotate(.5deg)}}
@keyframes tilt{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(2.4deg) translateY(-.8px)}}
@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(.9px) rotate(-.5deg)}}
@keyframes talk{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
@keyframes talkw{from{transform:scaleX(.7)}to{transform:scaleX(1.15)}}
@keyframes fpulse{50%{box-shadow:0 0 0 1px rgba(106,168,255,.8),0 0 calc(var(--s,44px)*.5) rgba(47,123,255,.5)}}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scanmv{from{transform:translateY(-10px)}to{transform:translateY(110px)}}

@media(max-width:820px){
 #side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-104%)}
 #side.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.8)}
 #backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:25;opacity:0;pointer-events:none;transition:opacity .4s}
 #backdrop.show{opacity:1;pointer-events:auto}
 #menuBtn{display:grid}
 .ahead{gap:13px;padding:12px 16px}.ahead .face{--s:62px!important}
 .aname{font-size:17px}
 .bubble{max-width:90%;font-size:14.5px}
}
</style>
</head>
<body>

<div id="splash">
  <svg class="logo" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="29" stroke="#2f7bff" stroke-opacity=".35" stroke-width="1.5"/><g class="o"><circle cx="32" cy="3" r="3.2" fill="#fff"/></g><g class="o2"><circle cx="32" cy="61" r="2.4" fill="#2f7bff"/></g><path d="M22 41c0-4 4-5 10-6s10-2 10-6-4-5-10-5-10 1-10 5" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
  <div class="sp-word"><span style="animation-delay:.1s">S</span><span style="animation-delay:.18s">Y</span><span style="animation-delay:.26s">N</span><span style="animation-delay:.34s">T</span><span style="animation-delay:.42s">R</span><span style="animation-delay:.5s">A</span></div>
  <div class="sp-sub">Feito pela E.ai<br>Programado por João Antonio</div>
</div>

<div id="app">
  <aside id="side">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="29" stroke="#2f7bff" stroke-opacity=".4" stroke-width="2"/><g class="o"><circle cx="32" cy="3" r="4" fill="#fff"/></g><path d="M22 41c0-4 4-5 10-6s10-2 10-6-4-5-10-5-10 1-10 5" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>SYNTRA</div>
    <button class="btn primary" id="newRoom">+ Nova sala</button>
    <div id="roomList"></div>
    <div class="side-foot"><div>Feito pela <b>E.ai</b><br>Programado por <b>João Antonio</b></div><button class="ib" id="setBtn" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button></div>
  </aside>
  <div id="backdrop"></div>

  <main id="main">
    <div class="top">
      <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div id="roomTitle">SYNTRA</div>
      <button class="pill" id="demoPill" hidden>modo demo · configurar chave</button>
    </div>
    <div id="team"></div>
    <section id="stage"><div id="stageHead"></div><div id="msgs"></div></section>
    <form class="comp" id="comp" hidden>
      <textarea id="inp" rows="1" placeholder="Mensagem…"></textarea>
      <button class="sendbtn" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </main>
</div>

<div id="modal"><div id="sheet"></div></div>

<script>
/* ============ CONFIG ============
   Chave da Groq em ROT13. Converta sua chave (gsk_...) com ROT13 e cole abaixo.
   Ex.: "gsk_abc" vira "tfx_nop". Também dá para colar a chave em ⚙ Configurações
   (o app mostra o valor em ROT13 para você colocar aqui). */
const _K = "tfx_CBR2L8kDUYYhUJPViwLgJTqlo3SLNvJ1iORABUSfJHYXszerm6Lk";
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODELS = ["openai/gpt-oss-120b","qwen/qwen3.8-27b"];

/* ============ UTILS ============ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const rot13=s=>s.replace(/[a-z]/gi,c=>{const b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+13)%26+b)});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let mx=null,my=null,mt=0;

(function loop(t){
 document.querySelectorAll('.face').forEach(f=>{
  const s=f._s||(f._s={x:0,y:0,p:Math.random()*100});let tx,ty;const st=f.dataset.state;
  if(st==='thinking'){tx=Math.sin(t/600+s.p)*2.4;ty=-1.4+Math.sin(t/900+s.p)*.4}
  else if(mx!=null&&t-mt<4000){const b=f.getBoundingClientRect(),dx=mx-(b.left+b.width/2),dy=my-(b.top+b.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/200);tx=dx/d*2.3*k;ty=dy/d*1.3*k}

 });requestAnimationFrame(loop)})(0);

const RTm={};const RT=id=>RTm[id]||(RTm[id]={busy:0,talk:0,label:'',log:[],last:0,timer:null,i:0});

function busyAdd(id,d,label){const rt=RT(id),a=findAgent(id);rt.busy=Math.max(0,rt.busy+d);
 if(d>0){if(rt.busy===1){rt.log=[];rt.i=0;rt.timer=setInterval(()=>{if(Date.now()-rt.last>3000)setLabel(id,STEP(findAgent(id),rt.i++))},1700)}
  rt.last=label?Date.now():0;setLabel(id,label||STEP(a,rt.i++))}
 else if(rt.busy===0){clearInterval(rt.timer);rt.timer=null}
 setUI(id)}

 document.querySelectorAll(`[data-status="${id}"]`).forEach(el=>{el.dataset.st=st;el.querySelector('span').textContent=st==='talking'?'Respondendo…':st==='thinking'?rt.label:(a.lastStatus?'Concluído · '+a.lastStatus:'Disponível')});

${mates}

SUA MEMÓRIA (persistente):
${mem}

REGRAS:
- Mensagens marcadas "[NOME disse]" vêm de colegas: responda de forma objetiva e colaborativa.
- ${canDel?'Se a tarefa se beneficiar da especialidade de um colega, delegue em "delegate" (máx. 2) com mensagem completa e autônoma. Nesse caso "reply" deve ser só um aviso curto (ex.: "Vou alinhar com a Lia e já volto"). Não delegue se você resolve bem sozinho.':'Não delegue: "delegate" deve ser [].'}
- Use "memory" para registrar UM fato novo e importante (preferência do usuário, decisão, dado do projeto); senão "".
- "status" = o que você está fazendo, 2 a 5 palavras.
Responda SOMENTE com JSON: {"reply":"","status":"","delegate":[{"to":"Nome","message":""}],"memory":""}`}
function history(a){return a.chat.slice(-18).map(e=>{
 if(e.t==='user')return{role:'user',content:e.text};
 if(e.t==='peer-in')return{role:'user',content:`[${e.from} disse]: ${e.text}`};
 if(e.t==='peer-out')return e.re?{role:'assistant',content:JSON.stringify({reply:e.text})}:{role:'assistant',content:JSON.stringify({reply:'',delegate:[{to:e.to,message:e.text}]})};
 return{role:'assistant',content:JSON.stringify({reply:e.text})}})}
function parseOut(c){let j;try{j=JSON.parse(c)}catch{const m=String(c).match(/\{[\s\S]*\}/);try{j=JSON.parse(m[0])}catch{j={reply:String(c)}}}
 return{reply:String(j.reply||'').trim()||'…',status:String(j.status||'').slice(0,40),delegate:Array.isArray(j.delegate)?j.delegate:[],memory:String(j.memory||'').trim()}}
async function groq(messages,model){
 for(let n=0;n<3;n++){
  const r=await fetch(GROQ_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+getKey()},body:JSON.stringify({model:model||S.model,messages,temperature:.75,max_tokens:1000,response_format:{type:'json_object'}})});
  if(r.status===429&&n<2){await sleep(Math.min(parseFloat(r.headers.get('retry-after'))||5,15)*1000);continue}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch{}throw new Error(`Groq ${r.status}: ${m||'falha na requisição'}`)}
  return parseOut((await r.json()).choices[0].message.content)}}
async function mock(room,a,o){await sleep(900+Math.random()*1200);const last=a.chat[a.chat.length-1]||{text:''},others=room.agents.filter(x=>x.id!==a.id);
 if(o.finalize)return{reply:`(demo) Juntei o que meu colega trouxe e fechei a resposta para você.`,status:'Consolidando resultado',delegate:[],memory:''};
 if(o.canDel&&last.t==='user'&&others.length&&last.text.length>12){const x=others[Math.floor(Math.random()*others.length)];return{reply:`Vou alinhar com ${x.name} e já te respondo.`,status:'Alinhando com o time',delegate:[{to:x.name,message:`Preciso da sua visão como ${x.role} sobre: "${last.text.slice(0,90)}"`}],memory:''}}
 return{reply:`(modo demo) Estou sem chave da Groq ativa, então respondo só em demonstração. Como ${a.role.toLowerCase()}, eu começaria entendendo seu objetivo e seu prazo. Abra ⚙ Configurações para ligar a IA de verdade.`,status:'Respondendo em demo',delegate:[],memory:''}}

/* ============ MOTOR DOS AGENTES ============ */
const otherModel=m=>MODELS.find(x=>x!==m)||m;
function friendly(e){const m=String(e&&e.message||e);
 if(/401|invalid api key/i.test(m))return 'Chave da Groq inválida ou expirada. Abra ⚙ Configurações e cole uma chave nova.';
 if(/429|rate limit/i.test(m))return 'Limite da Groq atingido. Aguarde um instante e tente de novo.';
 if(e instanceof TypeError||/failed to fetch|network/i.test(m))return 'Sem conexão com a Groq. Verifique a internet e tente de novo.';
 return 'Erro: '+m}
async function think(a,o){
 const room=roomOf(a);busyAdd(a.id,1,o.label);
 try{
  let out;
  if(getKey()){
   const msgs=[{role:'system',content:sysPrompt(room,a,o.canDel)},...history(a)];
   try{out=await groq(msgs,S.model)}
   catch(e){if(e instanceof TypeError||/Groq 401/.test(e.message))throw e;out=await groq(msgs,otherModel(S.model))}
  }else out=await mock(room,a,o);
  if(!o.canDel)out.delegate=[];
  if(out.status)a.lastStatus=out.status;
  if(out.memory&&!a.memory.includes(out.memory)){a.memory.push(out.memory);if(a.memory.length>30)a.memory.shift()}
  save();return out;
 }catch(e){return{error:friendly(e)}}
 finally{busyAdd(a.id,-1)}}
const QM={};
const enq=(id,fn)=>{const p=(QM[id]||Promise.resolve()).then(()=>fn());QM[id]=p.catch(()=>{});return p};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function findMate(room,a,n){const q=norm(n);if(!q)return null;const l=room.agents.filter(x=>x.id!==a.id);
 return l.find(x=>norm(x.name)===q)||l.find(x=>norm(x.name).startsWith(q)||q.startsWith(norm(x.name)))||l.find(x=>q.includes(norm(x.name)))||null}
const USER={name:'Você',id:null};
async function consult(room,a,t,msg){
 feedPush(room,a,t,msg);
 pushEntry(a,{t:'peer-out',to:t.name,fid:t.id,text:msg,ts:Date.now()});
 pushEntry(t,{t:'peer-in',from:a.name,fid:a.id,text:msg,ts:Date.now()});
 const out=await think(t,{canDel:false,label:`Respondendo a ${a.name}`});
 const reply=out.error?'Não consegui responder agora ('+out.error+')':out.reply;
 pushEntry(t,{t:'peer-out',re:1,to:a.name,fid:a.id,text:reply,ts:Date.now()});
 pulseTalk(t.id,Math.min(3000,Math.max(900,reply.length*14)));
 feedPush(room,t,a,reply);
 pushEntry(a,{t:'peer-in',from:t.name,fid:t.id,text:reply,ts:Date.now()});
 return reply}
async function runTurn(a,fromFeed){
 const room=roomOf(a);if(!room)return;
 const fail=m=>{pushEntry(a,{t:'bot',err:1,text:'⚠ '+m,ts:Date.now()});if(fromFeed)feedPush(room,a,USER,'⚠ '+m)};
 const out=await think(a,{canDel:room.agents.length>1});
 if(out.error)return fail(out.error);
 const dels=[];
 for(const d of out.delegate){const t=findMate(room,a,d&&d.to),m=String(d&&d.message||'').trim();if(t&&m&&!dels.some(x=>x.t===t))dels.push({t,m})}
 dels.length=Math.min(dels.length,2);
 await say(a,out.reply);
 if(fromFeed)feedPush(room,a,USER,out.reply);
 if(!dels.length)return;
 await Promise.all(dels.map(d=>consult(room,a,d.t,d.m)));
 const fin=await think(a,{canDel:false,finalize:true,label:'Consolidando respostas'});
 if(fin.error)return fail(fin.error);
 await say(a,fin.reply);
 if(fromFeed)feedPush(room,a,USER,fin.reply)}
function send(){
 const r=curRoom(),inp=$('#inp'),text=inp.value.trim();if(!r||!text)return;
 const fromFeed=S.view==='team';
 const a=fromFeed?r.agents[0]:r.agents.find(x=>x.id===S.view);
 if(!a){agentModal();return}
 inp.value='';inp.style.height='auto';
 if(fromFeed)feedPush(r,null,a,text);
 pushEntry(a,{t:'user',text,ts:Date.now()});
 enq(a.id,()=>runTurn(a,fromFeed))}

/* ============ SALAS E AGENTES ============ */
const mkAgent=(name,role,persona)=>({id:uid(),name,role,persona:persona||'',seed:Math.floor(Math.random()*1e9),memory:[],chat:[],lastStatus:''});
const PRESETS=[
 {n:'Estúdio criativo',a:[['Lia','Diretora de arte e marca'],['Theo','Redator publicitário'],['Nina','Estrategista de marketing']]},
 {n:'Time de software',a:[['Caio','Engenheiro de software'],['Bia','Designer de produto'],['Davi','Analista de QA']]},
 {n:'Pesquisa',a:[['Ana','Pesquisadora'],['Leo','Analista de dados'],['Sofia','Redatora técnica']]}];
const NAMES=['Lia','Theo','Nina','Caio','Bia','Davi','Sofia','Leo','Maya','Rafa','Iris','Noah','Duda','Enzo','Vera','Jade'];
const ROLES=['Pesquisador','Designer','Programador','Redator','Estrategista','Analista de dados','Gerente de projetos'];
function modal(html){const s=$('#sheet');delete s.dataset.preset;s.innerHTML=html;$('#modal').classList.add('show');const f=s.querySelector('input,textarea');if(f&&matchMedia('(pointer:fine)').matches)setTimeout(()=>f.focus(),60)}
function closeModal(){$('#modal').classList.remove('show')}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.classList.add('out'),2400);setTimeout(()=>d.remove(),3000)}
function roomModal(){
 modal(`<h3>Nova sala</h3><div class="sub">Uma sala é uma equipe: agentes que conversam e colaboram entre si.</div><form id="fRoom"><label>Nome da sala</label><input class="in" name="n" maxlength="40" placeholder="Ex.: Lançamento do produto" autocomplete="off" required><label>Equipe pronta (opcional)</label><div class="sugs">${PRESETS.map((p,i)=>`<button type="button" class="sug" data-preset="${i}">${esc(p.n)}</button>`).join('')}</div><div class="row"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Criar sala</button></div></form>`)}
function agentModal(){
 const r=curRoom();if(!r){roomModal();return}
 const free=NAMES.filter(n=>!r.agents.some(a=>norm(a.name)===norm(n)));const nm=free.length?free[Math.floor(Math.random()*free.length)]:'';
 modal(`<h3>Novo agente</h3><div class="sub">Ele ganha um rosto próprio, função e memória que não reinicia. O primeiro agente da sala é o líder e delega aos colegas.</div><form id="fAgent"><label>Nome</label><input class="in" name="n" maxlength="24" value="${esc(nm)}" autocomplete="off" required><label>Função</label><input class="in" name="r" maxlength="48" placeholder="Ex.: Designer de produto" autocomplete="off" required><div class="sugs">${ROLES.map(x=>`<button type="button" class="sug" data-role="${esc(x)}">${esc(x)}</button>`).join('')}</div><label>Personalidade (opcional)</label><textarea class="in" name="p" rows="2" maxlength="200" placeholder="Ex.: direta, criativa, odeia enrolação"></textarea><div class="row"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Criar agente</button></div></form>`)}
const memHtml=a=>a.memory.length?a.memory.map((m,i)=>`<div><span>${esc(m)}</span><button type="button" data-mi="${i}" aria-label="Apagar">${I.x}</button></div>`).join(''):'<div><span>Nada guardado ainda. O agente anota sozinho o que for importante.</span></div>';
function editModal(){
 const r=curRoom(),a=r&&r.agents.find(x=>x.id===S.view);if(!a)return;
 modal(`<h3>${esc(a.name)}</h3><div class="sub">Ajustes e memória persistente deste agente.</div><form id="fEdit" data-id="${a.id}"><label>Nome</label><input class="in" name="n" maxlength="24" value="${esc(a.name)}" required><label>Função</label><input class="in" name="r" maxlength="48" value="${esc(a.role)}" required><label>Personalidade</label><textarea class="in" name="p" rows="2" maxlength="200">${esc(a.persona)}</textarea><label>Memória</label><div class="mem" id="memBox">${memHtml(a)}</div><div class="row"><button type="button" class="btn ghost" id="delAgent">Excluir agente</button><button type="button" class="btn ghost" id="clrChat">Limpar conversa</button><button class="btn primary">Salvar</button></div></form>`)}
function settingsModal(){
 modal(`<h3>Configurações</h3><div class="sub">${getKey()?'Chave da Groq ativa.':'Sem chave válida: o app roda em modo demo.'} A chave fica só neste aparelho.</div><form id="fSet"><label>Chave da Groq (gsk_…)</label><input class="in" name="k" type="password" placeholder="Cole aqui para trocar a chave" autocomplete="off"><div class="sub" style="margin:0;font-size:12px">ROT13 para colocar no código: <code id="rv">—</code></div><label>Modelo</label><select class="in" name="m">${MODELS.map(m=>`<option ${m===S.model?'selected':''}>${m}</option>`).join('')}</select><div class="row"><button type="button" class="btn ghost" id="wipe">Apagar todos os dados</button><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`)}
function selectRoom(id){S.room=id;S.view=null;closeSide();save();renderAll()}
function delRoom(id){if(!confirm('Excluir esta sala e todos os seus agentes?'))return;S.rooms=S.rooms.filter(r=>r.id!==id);if(S.room===id){S.room=S.rooms[0]?S.rooms[0].id:null;S.view=null}save();renderAll()}
const openSide=()=>{$('#side').classList.add('open');$('#backdrop').classList.add('show')};
const closeSide=()=>{$('#side').classList.remove('open');$('#backdrop').classList.remove('show')};

/* ============ EVENTOS ============ */
document.addEventListener('click',e=>{const t=e.target;
 if(t===$('#modal')||t.closest('[data-close]')){closeModal();return}
 const del=t.closest('[data-del]');if(del){e.stopPropagation();delRoom(del.dataset.del);return}
 const rm=t.closest('.room');if(rm){selectRoom(rm.dataset.r);return}
 const ch=t.closest('[data-v]');if(ch){S.view=ch.dataset.v;save();renderTeam();renderStage();return}
 if(t.closest('#addAgent')){agentModal();return}
 const act=t.closest('[data-act]');if(act){act.dataset.act==='newRoom'?roomModal():agentModal();return}
 if(t.closest('#btnEdit')){editModal();return}
 if(t.closest('#newRoom')){closeSide();roomModal();return}
 if(t.closest('#setBtn')||t.closest('#demoPill')){closeSide();settingsModal();return}
 if(t.closest('#menuBtn')){openSide();return}
 if(t===$('#backdrop'))closeSide()});
$('#sheet').addEventListener('click',e=>{const t=e.target,s=$('#sheet');
 const p=t.closest('[data-preset]');if(p){const on=p.classList.contains('on');s.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('on'));if(on)delete s.dataset.preset;else{p.classList.add('on');s.dataset.preset=p.dataset.preset}return}
 const ro=t.closest('[data-role]');if(ro){const f=ro.closest('form');f.elements.r.value=ro.dataset.role;return}
 const mi=t.closest('[data-mi]');if(mi){const a=findAgent(mi.closest('form').dataset.id);if(a){a.memory.splice(+mi.dataset.mi,1);save();$('#memBox').innerHTML=memHtml(a)}return}
 if(t.closest('#delAgent')){const a=findAgent(t.closest('form').dataset.id),r=a&&roomOf(a);if(a&&confirm(`Excluir ${a.name}?`)){r.agents=r.agents.filter(x=>x!==a);S.view=null;save();closeModal();renderAll()}return}
 if(t.closest('#clrChat')){const a=findAgent(t.closest('form').dataset.id);if(a&&confirm('Limpar a conversa deste agente? A memória é mantida.')){a.chat=[];save();closeModal();renderStage()}return}
 if(t.closest('#wipe')){if(confirm('Apagar todas as salas, agentes e memórias?')){try{localStorage.removeItem('syntra.v1')}catch{}S={rooms:[],room:null,view:null,model:MODELS[0]};closeModal();renderAll()}}});
$('#sheet').addEventListener('input',e=>{if(e.target.name==='k'){const v=e.target.value.trim();$('#rv').textContent=v?rot13(v):'—'}});
$('#sheet').addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=n=>(f.elements[n]?f.elements[n].value:'').trim();
 if(f.id==='fRoom'){const name=v('n');if(!name)return;const r={id:uid(),name,agents:[],feed:[]};
  const pr=PRESETS[+($('#sheet').dataset.preset??-1)];if(pr)pr.a.forEach(x=>r.agents.push(mkAgent(x[0],x[1])));
  S.rooms.push(r);S.room=r.id;S.view=null;save();closeModal();closeSide();renderAll();if(!r.agents.length)agentModal()}
 else if(f.id==='fAgent'){const r=curRoom(),name=v('n'),role=v('r');if(!r||!name||!role)return;
  if(r.agents.some(a=>norm(a.name)===norm(name))){toast('Já existe um agente com esse nome nesta sala');return}
  const a=mkAgent(name,role,v('p'));r.agents.push(a);S.view=a.id;save();closeModal();renderAll()}
 else if(f.id==='fEdit'){const a=findAgent(f.dataset.id),r=a&&roomOf(a),name=v('n'),role=v('r');if(!a||!name||!role)return;
  if(r.agents.some(x=>x!==a&&norm(x.name)===norm(name))){toast('Já existe um agente com esse nome nesta sala');return}
  a.name=name;a.role=role;a.persona=v('p');save();closeModal();renderAll()}
 else if(f.id==='fSet'){const k=v('k');if(k){if(!k.startsWith('gsk_')){toast('A chave da Groq começa com gsk_');return}try{localStorage.setItem('syntra.key',rot13(k))}catch{}}
  S.model=v('m')||MODELS[0];save();closeModal();renderTop();toast(k?'Chave salva':'Configurações salvas')}});
$('#comp').addEventListener('submit',e=>{e.preventDefault();send()});
const inp=$('#inp');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* estilos extras */
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`.sug.on{border-color:var(--b);color:#fff;background:rgba(47,123,255,.18)}.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;padding:10px 18px;border-radius:99px;background:var(--p2);border:1px solid var(--b);box-shadow:var(--glow);font-size:13.5px;animation:fadeUp .4s var(--ease);transition:opacity .5s}.toast.out{opacity:0}`}));

/* ============ INÍCIO ============ */
function boot(){
 try{
  S.rooms.forEach(r=>{r.agents=r.agents||[];r.feed=r.feed||[];r.agents.forEach(a=>{a.chat=a.chat||[];a.memory=a.memory||[];a.persona=a.persona||'';if(!a.seed)a.seed=Math.floor(Math.random()*1e9)})});
  if(!MODELS.includes(S.model))S.model=MODELS[0];
  if(!curRoom())S.room=S.rooms[0]?S.rooms[0].id:null;
  renderAll();
 }catch(err){console.error(err)}
 setTimeout(()=>{const sp=$('#splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),900)},2300)}
boot();
</script>

/* garantia: se algo falhar no app, a tela de abertura nunca fica presa */
setTimeout(function(){var s=document.getElementById('splash');if(s)s.classList.add('out')},4500);
